<title>초대장</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; background:#fff; }
  body {
    color:#141311;
    font-family:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #stage { max-width:520px; margin:0 auto; }

  #gate {
    min-height:100svh; display:flex; flex-direction:column; justify-content:center;
    padding:0 32px; max-width:520px; margin:0 auto;
  }
  #gate .lab { font-size:10.5px; letter-spacing:.26em; color:#b8b2a8; }
  #gate h1 {
    margin:22px 0 0; font-size:30px; font-weight:600; letter-spacing:-.04em; line-height:1.3;
  }
  #gate h1 i {
    font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:#c6512f;
  }
  #gate p { margin:14px 0 0; font-size:14px; line-height:1.9; color:#8a857c; letter-spacing:-.015em; }
  #gate form { margin-top:34px; display:grid; gap:8px; }
  #gate input {
    width:100%; padding:17px 16px; border:1px solid #e4e0d8; border-radius:11px;
    font:inherit; font-size:16px; letter-spacing:-.01em; background:#fff; color:#141311;
  }
  #gate input:focus { outline:none; border-color:#141311; }
  #gate button {
    width:100%; padding:17px; border:0; border-radius:11px; background:#141311; color:#fff;
    font:inherit; font-size:14.5px; font-weight:600; letter-spacing:-.015em; cursor:pointer;
  }
  #gate button:disabled { opacity:.45; cursor:default; }
  #err { min-height:20px; margin:4px 0 0; font-size:13px; color:#c6512f; letter-spacing:-.01em; }
  #gate footer { margin-top:40px; font-size:11px; letter-spacing:.18em; color:#d6d1c8; }
</style>
</head>
<body>

<div id="gate">
  <div class="lab">PRIVATE</div>
  <h1>초대장을 <i>열어보세요</i></h1>
  <p>받으신 비밀번호를 넣어주세요.</p>
  <form id="f">
    <input id="pw" type="password" inputmode="text" autocomplete="current-password"
           placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button id="go" type="submit">열기</button>
  </form>
  <p id="err" role="status"></p>
  <footer>29 NOV 2026</footer>
</div>

<div id="stage"></div>

  var gate = document.getElementById("gate");
  var stage = document.getElementById("stage");
  var form = document.getElementById("f");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var err = document.getElementById("err");

  function bin(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  function open(password) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: bin(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(PAYLOAD.iv) }, key, bin(PAYLOAD.ct));
      })
      .then(function (buf) {
        return new TextDecoder().decode(buf);
      });
  }

  function show(html, password) {
    stage.innerHTML = html;
    gate.remove();
    try { localStorage.setItem(KEY, password); } catch (e) {}
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = pw.value;
    if (!password) return;
    go.disabled = true; go.textContent = "여는 중"; err.textContent = "";
    open(password).then(
      function (html) { show(html, password); },
      function () {
        go.disabled = false; go.textContent = "열기";
        err.textContent = "비밀번호가 맞지 않아요.";
        pw.select();
      }
    );
  });

  // 한 번 열어본 기기에서는 다시 묻지 않습니다.
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved).then(function (html) { show(html, saved); }, function () {});
})();
</script>
